  <style>
    html,
    body {
      background-color: #FFFFFF;
      color: #18181B;
      margin: 0;
      padding: 0;
      scroll-behavior: auto !important;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #FFFFFF;
    }

    #initial-site-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      z-index: 999999;
      background-color: #FFFFFF;
      background-image:
        linear-gradient(rgba(17, 17, 19, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 17, 19, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      background-position: center center;
      overflow: hidden;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: all;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #initial-site-loader::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(248, 250, 252, 0.8) 100%);
      pointer-events: none;
    }

    #initial-site-loader.exiting {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(1.02) !important;
    }

    .initial-loader-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      margin: 0;
      padding: 0;
    }

    .initial-loader-spinner-wrap {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .initial-loader-track {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .initial-loader-spinner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform-origin: center center;
      animation: studioSpinKeyframes 1.1s linear infinite;
      filter: drop-shadow(0 0 6px rgba(27, 154, 205, 0.28));
    }

    @keyframes studioSpinKeyframes {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .initial-loader-logo-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }

    .initial-loader-logo {
      display: block;
      width: 54px;
      height: 54px;
      object-fit: contain;
      shape-rendering: geometricPrecision;
      filter: drop-shadow(0 2px 8px rgba(27, 154, 205, 0.15));
    }

    @media (max-width: 480px) {
      .initial-loader-spinner-wrap {
        width: 136px;
        height: 136px;
      }

      .initial-loader-logo {
        width: 44px;
        height: 44px;
      }
    }
  </style>
